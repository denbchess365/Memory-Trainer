<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the app draw under the iPhone notch; safe-area insets are handled in CSS -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Memory Trainer</title>
  <meta name="description" content="Private, offline flashcards with spaced repetition.">
  <!-- Strict CSP: only same-origin code, no network calls to anywhere else. Data URLs/blobs allowed for backups. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#4f46e5">

  <!-- iOS home-screen app settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Memory">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Theme is applied before first paint to avoid a white flash in dark mode -->
  <script src="js/theme-boot.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar" id="topbar">
    <button class="icon-btn" id="backBtn" aria-label="Back" hidden>‹</button>
    <h1 id="pageTitle">Memory Trainer</h1>
    <button class="icon-btn" id="quickAddBtn" aria-label="Quick add card" title="Quick add (N)">＋</button>
  </header>

  <main id="main" tabindex="-1" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar" aria-label="Primary">
    <a href="#/home" data-tab="home"><span aria-hidden="true">⌂</span><small>Home</small></a>
    <a href="#/decks" data-tab="decks"><span aria-hidden="true">▤</span><small>Decks</small></a>
    <a href="#/search" data-tab="search"><span aria-hidden="true">⌕</span><small>Search</small></a>
    <a href="#/stats" data-tab="stats"><span aria-hidden="true">▥</span><small>Stats</small></a>
    <a href="#/settings" data-tab="settings"><span aria-hidden="true">⚙</span><small>Settings</small></a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="modal" aria-labelledby="modalTitle"></dialog>

  <noscript><p class="noscript">Memory Trainer needs JavaScript enabled.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
